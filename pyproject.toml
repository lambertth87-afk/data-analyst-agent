[project]
name = "data-analyst-agent"
version = "0.1.0"
description = "Agent analyste de données conversationnel (Mistral Agents SDK)"
requires-python = ">=3.12"
dependencies = [
    "mistralai-agents>=1.1,<2",
    "pandas>=2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.mistralai.agents]
entrypoint = "main:agent"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
